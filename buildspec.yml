version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    ECR_REPO_URI: 817827901549.dkr.ecr.us-east-1.amazonaws.com/fastapi-app

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO_URI

  build:
    commands:
      - docker build -t fastapi-app .
      - docker tag fastapi-app:latest $ECR_REPO_URI:latest

  post_build:
    commands:
      - docker push $ECR_REPO_URI:latest
      - printf '[{"name":"backend-api","imageUri":"%s"}]' $ECR_REPO_URI:latest > imagedefinitions.json

artifacts:
  files:
    - appspec.yaml
    - imagedefinitions.json